name: Source and release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check current source and document identities
        run: python -B scripts/check_repository.py
      - name: Test repository and release validation
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Test dependency pins and the legacy inventory entry point
        run: python -B -m unittest discover -s scripts -p test_current_package.py -v
      - name: Check an export of this commit
        run: python -B scripts/export_release.py --ref "${{ github.sha }}" --output "${{ runner.temp }}/ModularRep-checked.zip"
